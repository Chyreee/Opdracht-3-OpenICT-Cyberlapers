<!DOCTYPE html>
<html> 
<head>
    <title>My Web Page</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {background-color: rgb(112, 39, 39);}
        h1 {
        color:aquamarine;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-size: 400%;
        border: 2px solid powderblue;
        padding: 50px;
         margin: 50px;
        }
        p {
            color:brown;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 150%;
            border: 2px solid rgb(32, 22, 163);
            padding: 20px;
             margin: 30px;
        }
        button
        {
            background-color: rgba(238, 234, 13, 0.466);
            color: rgb(241, 5, 5);
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<button onclick="openTextField()">Ask Question</button>

<dialog id="textPopup">
    <h3>Enter your Question</h3>
    <textarea id="question"
    placeholder="Type in your question!"
    rows="5"
    cols="35"></textarea>

    <br><br>

    <button onclick="closeTextField()">Cancel</button>
    <button onclick="submitText()">Submit</button>

    <script>
        function openTextField() {
            document.getElementById("textPopup").showModal();
        }

        function closeTextField() {
            document.getElementById("textPopup").close();
        }

        function submitText() {
            var question = document.getElementById("question").value;
            alert("Your question: " + question);
            document.getElementById("textPopup").close();
        }
    </script>
</dialog>
</body>
</html>
