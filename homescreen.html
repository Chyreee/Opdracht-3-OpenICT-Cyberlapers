
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HumanGI - Code Sharing App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="homescreen.css">
</head>

<body>

    <div class="browser">

        <!-- TOP NAVIGATION -->
        <header class="topbar">

            <div class="brand">
                <button
                    type="button"
                    onclick="window.location.href='homescreen.html'">
                    HumanGI
                </button>
            </div>

            <input
                type="text"
                class="search"
                id="searchInput"
                placeholder="Zoek hier een vraag..."
                aria-label="Zoek een vraag"
            >

            <details class="notification-container">
                <summary
                    class="notification"
                    aria-label="Open notificaties"
                    title="Open notificaties">
                    <svg class="notification-default" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bell" viewBox="0 0 16 16">
  <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"/>
</svg>
                    <svg class="notification-hover" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bell-fill" viewBox="0 0 16 16">
  <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2m.995-14.901a1 1 0 1 0-1.99 0A5 5 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901"/>
</svg>
                </summary>
                <div class="notification-dropdown">
                    <p>Je hebt geen notificaties.</p>
                </div>
            </details>
            <button 
                class="user"
                type="button"
                aria-label="Open profiel"
                title="Open profiel"
                onclick="window.location.href='profile.html'">
                <svg class="profile-icon bi bi-person" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
  <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
</svg>
            </button>

        </header>


        <!-- MAIN PAGE LAYOUT -->
        <main class="layout">


            <!-- LEFT SIDEBAR: LEADERBOARD -->
            <aside class="leaderboard">

                <div class="leaderboard-title">
                 <h2>Weekly Leaderboard</h2>
                </div>

                <div class="leader-list">

                    <div class="leader current"></div>
                    <div class="leader"></div>
                    <div class="leader"></div>
                    <div class="leader"></div>
                    <div class="leader"></div>
                    <div class="leader"></div>
                    <div class="leader"></div>
                    <div class="leader"></div>
                    <div class="leader"></div>
                    <div class="leader"></div>

                </div>

            </aside>


            <!-- CENTER: QUESTIONS -->
            <section class="questions">

                <!-- ASK QUESTION BUTTON -->
                <div class="ask-question">

                    <button
                        type="button"
                        id="askQuestionButton">
                        Ask a question
                    </button>

                </div>


                <!-- QUESTION FORM -->
                <form id="questionForm" hidden>

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        maxlength="50"
                        required
                    >


                    <label for="questionText">
                        Your question
                    </label>

                    <textarea
                        id="questionText"
                        required
                    ></textarea>


                    <label for="code">
                        Code snippet
                    </label>

                    <textarea
                        id="code"
                        required
                    ></textarea>


                    <label for="studyYear">
                        Study year
                    </label>

                    <select id="studyYear" required>

                        <option value="">
                            Select a year
                        </option>

                        <option value="1">Year 1</option>
                        <option value="2">Year 2</option>
                        <option value="3">Year 3</option>
                        <option value="4">Year 4</option>

                    </select>


                    <label for="beroepsrol">
                        Beroepsrol
                    </label>

                    <input
                        type="text"
                        id="beroepsrol"
                        placeholder="Bijv. Software developer"
                        required
                    >


                    <!-- FORM BUTTONS -->
                    <button type="submit">
                        Submit question
                    </button>

                    <button
                        type="button"
                        id="cancelQuestionButton">
                        Cancel
                    </button>


                    <p id="formMessage"></p>

                </form>

            </section>


            <!-- RIGHT SIDEBAR -->
            <aside class="right-sidebar" aria-label="Plattegrond Heidelberglaan 15">
                <iframe
                    class="floor-map-frame"
                    id="floorMapFrame"
                    src="plattegrond.html?embed=1"
                    title="Verdiepingen en plattegrond van Heidelberglaan 15"
                    allow="fullscreen"
                ></iframe>
            </aside>


        </main>

    </div>
    <dialog id="questionDialog">
    <button type="button" id="closeDialogButton" aria-label="Close">X</button>

    <h2 id="dialogTitle"></h2>
    <p id="dialogMeta"></p>
    <p id="dialogText"></p>
    <pre id="dialogCode"></pre>

    <div id="commentsArea">
    <h3>Comments</h3>
    <ul id="commentList"></ul>

    <form id="commentForm">
        <input type="text" id="commentInput" placeholder="Add a comment" required>
        <button type="submit">Post</button>
    </form>
</div>
</dialog>
    <script src="homescreen.js"></script>
</body>
</html>
