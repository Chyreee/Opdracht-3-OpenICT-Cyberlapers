<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="updownvote.css">
    <title>Document</title>
</head>
<body>
<div class="container">
    <div class="vote-container">
        <button class="upvote-button" type="button" aria-pressed="false">
            <img src="uparrow.png" alt="Upvote">
        </button>
        <span class="vote-count">0</span>
    </div>
    <div class="vote-container">
        <button class="downvote-button" type="button" aria-pressed="false">
            <img src="downarrow.png" alt="Downvote">
        </button>
        <span class="vote-count">0</span>
    </div>
</div>
<script src="updownvote.js"></script>
    
</body>
</html>
