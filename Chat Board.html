<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --pink: #ff3366;
            --coral: #ff6b6b;
            --teal: #1dd3b0;
            --panel: #212529;
            --background: #0c0f16;
            --text: #f5f7fa;
            --muted: #b8c0cc;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: Arial, sans-serif;
            line-height: 1.5;
            background: var(--background);
        }

        main {
            min-width: 0;
            min-height: 100vh;
            padding: 32px clamp(16px, 3vw, 40px);
            background: var(--panel);
        }

        h1 {
            color: var(--pink);
        }

        h2 {
            color: var(--teal);
        }

        textarea {
            width: 100%;
            min-height: 100px;
            margin: 8px 0 12px;
            padding: 12px;
            font: inherit;
            color: var(--text);
            resize: vertical;
            border: 1px solid var(--teal);
            border-radius: 6px;
            background: var(--background);
        }

        button {
            margin: 0 8px 8px 0;
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            background: var(--pink);
            color: var(--background);
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover {
            background: var(--coral);
        }

        button:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 2px;
        }

        #messagePopup {
            width: min(480px, calc(100vw - 32px));
            padding: 24px;
            color: var(--text);
            border: 1px solid var(--teal);
            border-radius: 8px;
            background: var(--panel);
        }

        #messagePopup::backdrop {
            background: #0009;
        }

        .settings {
            margin-top: 20px;
            padding: 14px;
            border: 1px solid #454b52;
            border-radius: 8px;
            background: var(--background);
        }

        .settings label {
            display: block;
            margin: 8px 0;
        }

        .settings input {
            accent-color: var(--teal);
        }

        #status {
            color: var(--muted);
            font-size: 14px;
        }

        #messages {
            margin-top: 24px;
        }

        .question-button {
            display: block;
            width: 100%;
            margin: 12px 0;
            text-align: left;
            overflow-wrap: anywhere;
        }

        #chatPopup {
            width: min(600px, calc(100vw - 32px));
            max-height: min(80vh, 700px);
            padding: 24px;
            color: var(--text);
            border: 1px solid var(--teal);
            border-radius: 8px;
            background: var(--panel);
        }

        #chatPopup::backdrop {
            background: #0009;
        }

        #chatMessages {
            max-height: 40vh;
            overflow-y: auto;
        }

        .message {
            margin: 12px 0;
            padding: 12px;
            border-left: 4px solid var(--pink);
            background: var(--background);
            overflow-wrap: anywhere;
            border-radius: 4px;
        }

        .answer {
            margin-left: 24px;
            border-left-color: var(--teal);
        }

        @media (max-width: 700px) {
            main {
                padding: 24px 14px;
            }

            .answer {
                margin-left: 10px;
            }
        }

        /* Popup notification */
        #notification {
            position: fixed;
            right: 20px;
            bottom: 20px;
            max-width: min(360px, calc(100vw - 40px));
            padding: 16px 20px;
            background: var(--pink);
            color: white;
            border-radius: 10px;
            box-shadow: 0 8px 24px #0008;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 1000;
        }

        #notification.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #notification strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Chat Board</h1>
        <p>Ask a question or open a question to reply in its chat.</p>

        <div>
            <button type="button" onclick="openTextField()">
                Ask Question
            </button>
        </div>

        <dialog id="messagePopup" aria-labelledby="messageTitle">
            <h2 id="messageTitle"></h2>
            <label id="messageLabel" for="messageInput"></label>
            <textarea
                id="messageInput"
                placeholder=""
                rows="5"
            ></textarea>

            <button type="button" onclick="closeTextField()">Cancel</button>
            <button type="button" onclick="submitText()">Submit</button>
        </dialog>

        <section class="settings" aria-label="Notification settings">
            <h2>Notification settings</h2>

            <label>
                <input type="checkbox" id="soundEnabled" checked>
                Enable notification sound
            </label>

            <button type="button" onclick="testNotification()">
                Test notification sound
            </button>

            <p id="status" aria-live="polite">
                Sound is enabled. Browser notification permission will be
                requested when you post your first message.
            </p>
        </section>

        <section
            id="messages"
            aria-live="polite"
            aria-label="Chats and answers"
        ></section>

        <dialog id="chatPopup" aria-labelledby="chatTitle">
            <h2 id="chatTitle"></h2>
            <section id="chatMessages" aria-live="polite"></section>
            <label for="chatInput">Your message</label>
            <textarea
                id="chatInput"
                placeholder="Write a message..."
                rows="3"
            ></textarea>
            <button type="button" onclick="closeChat()">Close chat</button>
            <button type="button" onclick="submitChatMessage()">Send</button>
        </dialog>
    </main>

    <div
        id="notification"
        role="status"
        aria-live="polite"
        aria-atomic="true"
    >
        <strong id="notificationTitle"></strong>
        <span id="notificationText"></span>
    </div>

    <script>
        // Decode notification WAV files with Web Audio for browser compatibility.
        let audioContext = null;
        const notificationSounds = {
            Question: "sounds/1.wav",
            Answer: "sounds/2.wav"
        };
        const decodedSounds = {};
        let notificationTimer = null;
        let notificationPermissionRequest = null;

        const soundEnabled = document.getElementById("soundEnabled");
        const status = document.getElementById("status");
        const chats = [];
        let activeChat = null;

        function openTextField() {
            document.getElementById("messageTitle").textContent = "Enter your Question";
            document.getElementById("messageLabel").textContent = "Your question";
            document.getElementById("messageInput").placeholder = "Type in your question!";
            document.getElementById("messagePopup").showModal();
            document.getElementById("messageInput").focus();
        }

        function closeTextField() {
            document.getElementById("messagePopup").close();
        }

        function submitText() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();

            closeTextField();

            if (text) {
                addQuestion(text);
            }

            input.value = "";
        }

        async function playNotificationSound(type) {
            if (!soundEnabled.checked) return false;

            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) {
                status.textContent =
                    "Audio notifications are not supported in this browser.";
                return false;
            }

            try {
                if (!audioContext) {
                    audioContext = new AudioContextClass();
                }

                if (audioContext.state === "suspended") {
                    await audioContext.resume();
                }

                if (!decodedSounds[type]) {
                    const response = await fetch(notificationSounds[type]);
                    if (!response.ok) {
                        throw new Error(
                            `Could not load ${notificationSounds[type]} (${response.status}).`
                        );
                    }

                    decodedSounds[type] = await audioContext.decodeAudioData(
                        await response.arrayBuffer()
                    );
                }

                const source = audioContext.createBufferSource();
                source.buffer = decodedSounds[type];
                source.connect(audioContext.destination);
                source.start();
                return true;
            } catch (error) {
                console.warn("Could not play notification sound:", error);
                status.textContent =
                    `Could not play the ${type.toLowerCase()} notification sound: ${error.message}`;
                return false;
            }
        }

        // Display an in-page popup.
        function showToast(title, message) {
            const notification = document.getElementById("notification");

            document.getElementById("notificationTitle").textContent = title;
            document.getElementById("notificationText").textContent = message;

            notification.classList.add("visible");

            clearTimeout(notificationTimer);

            notificationTimer = setTimeout(() => {
                notification.classList.remove("visible");
            }, 3500);
        }

        function displayBrowserNotification(title, message) {
            try {
                const notification = new Notification(title, {
                    body: message,
                    tag: "chat-board-message"
                });

                notification.onclick = () => {
                    window.focus();
                    notification.close();
                };
            } catch (error) {
                console.warn(
                    "Browser notification could not be displayed:",
                    error
                );
            }
        }

        // Ask automatically when a message is posted, inside a user action.
        function showBrowserNotification(title, message) {
            if (!("Notification" in window)) {
                status.textContent =
                    "Browser notifications are not supported in this browser.";
                return;
            }
            if (Notification.permission === "granted") {
                displayBrowserNotification(title, message);
                return;
            }
            if (Notification.permission === "denied") {
                status.textContent =
                    "Browser notifications are blocked in browser settings.";
                return;
            }

            if (!notificationPermissionRequest) {
                notificationPermissionRequest =
                    Notification.requestPermission()
                        .then(permission => {
                            if (permission === "granted") {
                                status.textContent =
                                    "Browser notifications enabled.";
                                displayBrowserNotification(title, message);
                            } else {
                                status.textContent =
                                    "Browser notification permission was not granted.";
                            }
                        })
                        .catch(error => {
                            console.warn(
                                "Could not request browser notification permission:",
                                error
                            );
                            status.textContent =
                                "Could not request browser notification permission.";
                        })
                        .finally(() => {
                            notificationPermissionRequest = null;
                        });
            }
        }

        // One central function for every new message.
        // A future server/WebSocket can call this function too.
        function notifyNewMessage(type, message) {
            const title = type === "Question"
                ? "New question!"
                : "New answer!";

            showToast(title, message);
            playNotificationSound(type);
            showBrowserNotification(title, message);
        }

        function addQuestion(text) {
            const chat = {
                question: text,
                replies: []
            };
            const chatIndex = chats.push(chat) - 1;
            const button = document.createElement("button");

            button.type = "button";
            button.className = "question-button";
            button.textContent = text;
            button.setAttribute("aria-label", `Open chat: ${text}`);
            button.addEventListener("click", () => openChat(chatIndex));

            document.getElementById("messages").appendChild(button);
            notifyNewMessage("Question", text);
        }

        function openChat(chatIndex) {
            activeChat = chats[chatIndex];
            document.getElementById("chatTitle").textContent =
                activeChat.question;
            renderChatMessages();
            document.getElementById("chatPopup").showModal();
            document.getElementById("chatInput").focus();
        }

        function renderChatMessages() {
            const chatMessages = document.getElementById("chatMessages");
            chatMessages.replaceChildren();

            const question = document.createElement("p");
            question.className = "message question";
            question.textContent = `Question: ${activeChat.question}`;
            chatMessages.appendChild(question);

            activeChat.replies.forEach(reply => {
                const message = document.createElement("p");
                message.className = "message answer";
                message.textContent = `Answer: ${reply}`;
                chatMessages.appendChild(message);
            });
        }

        function closeChat() {
            document.getElementById("chatPopup").close();
            activeChat = null;
        }

        function submitChatMessage() {
            const input = document.getElementById("chatInput");
            const text = input.value.trim();

            if (!text || !activeChat) return;

            activeChat.replies.push(text);
            renderChatMessages();
            input.value = "";
            input.focus();
            notifyNewMessage("Answer", text);
        }

        async function testNotification() {
            if (!soundEnabled.checked) {
                status.textContent = "Audio is disabled. Enable sound to test it.";
                return;
            }

            const played = await playNotificationSound("Question");
            if (played) {
                status.textContent = "Test question sound played.";
            }
        }

        // Update status when sound settings change.
        soundEnabled.addEventListener("change", () => {
            status.textContent = soundEnabled.checked
                ? "Sound is enabled."
                : "Sound is disabled.";
        });
    </script>
</body>
</html>
