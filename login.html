<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">
</head>
<div class="login">
    <h1 id="titel">Login</h1>

<form id="loginForm">
    <p>Gebruikersnaam</p>
    <input type="text" id="username" required>

    <p>Wachtwoord</p>
    <input type="password" id="password" required>

    <div id="studyYear" style="display: none;">
        <p>Studiejaar</p>
        <select id="studyYearInput">
            <option value="">Kies je studiejaar</option>
            <option value="1">Jaar 1</option>
            <option value="2">Jaar 2</option>
            <option value="3">Jaar 3</option>
            <option value="4">Jaar 4</option>
        </select>
    </div>

    <div id="beroepsrol" style="display: none;">
        <p>Beroepsrol</p>
        <select id="beroepsrolInput" placeholder="Kies je beroepsrol">
            <option value="Software Developer">Software Developer</option>
            <option value="AI">AI</option>
            <option value="Cyber Security">Cyber Security</option>
            <option value="TI">TI</option>
            <option value="Backend Developer">Backend Developer</option>
            <option value="Frontend Developer">Frontend Developer</option>
            <option value="BIT">Business IT</option>
            <option value="UI/UX">UI/UX</option>
            <option value="Game Developer">Game Developer</option>
        </select>
    </div>

    <input class="submit" type="submit" value="Inloggen" id="knop">
</form>

    <p id="tekst">
        Nog geen account?
        <a href="#" onclick="registreren()">Registreren</a>
    </p>
</div>

<script src="login.js"></script>
</body>
</html>
